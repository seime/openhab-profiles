# add-on

addon.seimeprofiles.name = Seime Profiles
addon.seimeprofiles.description = A set of additional profiles, such as redelivering commands until the handler confirms the state.

# profile types

profile-type.seime-profiles.redeliver-command.label = Redeliver Command
profile.config.seime-profiles.redeliver-command.numRedeliveries.label = Number Of Redeliveries
profile.config.seime-profiles.redeliver-command.numRedeliveries.description = The number of redeliveries (in addition to the original attempt).
profile.config.seime-profiles.redeliver-command.redeliverDelayMillis.label = Redelivery Delay
profile.config.seime-profiles.redeliver-command.redeliverDelayMillis.description = The number of milliseconds between each redelivery attempt.
